<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holiday Countdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Holiday Countdown</h1>

        <div class="country-buttons"> 
            <button id="cz" class="country-btn">CZ</button>
            <button id="usa" class="country-btn">USA</button>
            <button id="de" class="country-btn">DE</button>
        </div>

        <section class="panel">
            <div class="holiday-name" id="holidayName">-</div>
            <div class="holiday-date" id="holidayDate">-</div>
        </section>

        <section class="countdown">
            <div class="time-box"><div class="num" id="cdDays">0</div><div class="label">Dny</div></div>
            <div class="time-box"><div class="num" id="cdHours">0</div><div class="label">Hodiny</div></div>
            <div class="time-box"><div class="num" id="cdMins">0</div><div class="label">Minuty</div></div>
            <div class="time-box"><div class="num" id="cdSecs">0</div><div class="label">Sekundy</div></div>
        </section>
    </div>
</body>
</html>
